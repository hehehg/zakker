name: Build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --project-name zakker --org com.zakker --platforms=android
      - name: Patch Android (permissions, receivers, desugaring, name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="zakker"#android:label="ذكّرني"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><application#' $M
          sed -i 's#</application>#<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver></application>#' $M
          G=android/app/build.gradle.kts
          sed -i 's#compileOptions {#compileOptions {\n        isCoreLibraryDesugaringEnabled = true#' $G
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> $G
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-android.yaml
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: zakker-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      _CL_: '/WX- /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create . --project-name zakker --org com.zakker --platforms=windows
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml
      - run: flutter build windows --release
      - name: Portable zip + installer
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\zakker-windows-portable.zip
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\zakker.iss
      - uses: actions/upload-artifact@v4
        with: { name: zakker-windows, path: dist }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cd out
          cp "$(find . -name app-release.apk)" zakker-android.apk
          cp "$(find . -name app-release.aab)" zakker-android.aab
          cp "$(find . -name zakker-windows-setup.exe)" .
          cp "$(find . -name zakker-windows-portable.zip)" .
          gh release create "v1.0.${{ github.run_number }}" zakker-android.apk zakker-android.aab zakker-windows-setup.exe zakker-windows-portable.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "ذكّرني v1.0.${{ github.run_number }}" \
            --notes "${COMMIT_MSG:-بناء تلقائي}"
